# /etc/tmpfiles.d/moyu-check.conf
# Writable HOME for the dedicated review check identity. The supervisor unit's
# ReadWritePaths needs the path to exist before the service starts.
d /var/lib/moyu-check 0750 moyu-check moyu-check -
d /var/lib/moyu-check/home 0700 moyu-check moyu-check -
d /var/lib/moyu-check/home/tmp 0700 moyu-check moyu-check -
