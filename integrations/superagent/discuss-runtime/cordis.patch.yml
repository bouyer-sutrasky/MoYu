# Read-only discussion runtime: no shell, jobs, subagents, workflows or write/edit tools.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-working-directory
  disabled: true
- id: tool-fs
  config:
    write: false
    edit: false
    read: true
    readImage: true
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      commandcode:
        displayName: Command Code
        apiKeyEnv: COMMAND_CODE_API_KEY
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        defaultContextWindow: 1000000
        defaultMaxTokens: 32768
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
- id: agent-default-model
  config:
    provider: !!js process.env.DSH_DISCUSS_PROVIDER ?? 'commandcode'
    model: !!js process.env.DSH_DISCUSS_MODEL ?? 'deepseek/deepseek-v4.1-flash'
    reasoningEffort: !!js process.env.DSH_DISCUSS_REASONING || null
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.env.DSH_DISCUSS_WORKSPACE ?? '/srv/m4-discuss/workspace'
